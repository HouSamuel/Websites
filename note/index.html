<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
        }
        .switch-btn {
            padding: 18px 45px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background-color: #333842;
            color: #f0f0f0;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .switch-btn:hover {
            background-color: #444b58;
        }
    </style>
</head>
<body>
    <button class="switch-btn">你真的要看吗</button>

    <script>
        const btn = document.querySelector('.switch-btn');
        // 原始按钮文字与秘密文字，自行修改即可
        const originText = "你真的要看吗";
        const secretText = "M❤️强";
        let status = false;

        btn.addEventListener('click', () => {
            if (!status) {
                btn.innerText = secretText;
                status = true;
            } else {
                btn.innerText = originText;
                status = false;
            }
        })
    </script>
</body>
</html>
